[project]
name = "cv-proj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raden Muhammad Muaz", email = "rara89608@hbku.edu.qa" }
]
requires-python = ">=3.12"
dependencies = [
    "clearml>=2.1.12",
    "deprecated>=1.3.1",
    "faster-coco-eval==1.7.2",
    "kornia==0.7",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.2",
    "numpy>=2.5.2",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "peft>=0.20.0",
    "pillow>=10.0",
    "protobuf==3.20.0",
    "pycocotools>=2.0.11",
    "pydantic>=2.13.5",
    "pydeprecate==0.9",
    "pytorch-lightning==2.6.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "supervision>=0.30.1",
    "tensorboard==2.13.0",
    "torch==2.10.0",
    "torch-linear-assignment>=0.0.6",
    "torchmetrics[detection]==1.8.2",
    "torchvision==0.25.0",
    "tqdm>=4.70.0",
    "transformers>=5.16.1",
    "wandb>=0.25.0",
]

[project.scripts]
cv-proj = "cv_proj:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
