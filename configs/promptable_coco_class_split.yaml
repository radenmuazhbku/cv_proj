# Reproducible held-out-class prompt experiment.
# COCO category IDs: train and test sets must remain disjoint.
data_root: datasets/mscoco
source_annotation: datasets/mscoco/annotations_trainval2017/annotations/instances_train2017.json
train_image_dir: datasets/mscoco/train2017
test_image_dir: datasets/mscoco/val2017
output_dir: datasets/mscoco_prompt_split
train_images: 100
test_images: 100
seed: 7
train_classes: [1, 3, 8, 9, 10, 11, 13, 14, 15, 16] # person, car, truck, traffic light, fire hydrant, stop sign, bench, bird, cat, dog
test_classes: [17, 18, 19, 20, 21, 22, 23, 24, 25, 27] # horse, sheep, cow, elephant, bear, zebra, giraffe, backpack, umbrella, tie
resolution: 384
steps: 100
device: cpu
checkpoint: logs/promptable_coco_class_split.pt
negative_ratio: 1.0
negative_iou_threshold: 0.1
learning_rate: 0.0001
weight_decay: 0.05
objectness_weight: 1.0
bbox_weight: 5.0
giou_weight: 2.0
